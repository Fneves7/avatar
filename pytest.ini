[pytest]
testpaths = tests
# Por defeito só os testes rápidos (sem MediaPipe nem comparação com o último commit).
addopts = -m "not mediapipe and not parity" -q
filterwarnings =
    ignore::DeprecationWarning:importlib._bootstrap
markers =
    mediapipe: usa o MediaPipe a sério (mais lento)
    parity: compara o estilo cartoon pixel a pixel com um commit (por defeito HEAD; AVATAR_PARITY_REF para outro)
